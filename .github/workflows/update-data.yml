name: Update price data
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: price-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Collect prices and FX
        id: collect
        continue-on-error: true
        run: npm run update
      - run: npm run validate
      - name: Commit valid observations, including partial failures
        run: |
          git config user.name 'gpt-price-radar[bot]'
          git config user.email 'gpt-price-radar[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh public prices and daily FX'
            git push
          fi
      - name: Surface collection failures
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Some sources failed. Valid observations were saved; stale data was not relabeled.'
          exit 1
